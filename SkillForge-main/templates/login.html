<!DOCTYPE html>

<html>

<head>

<title>

Login

</title>


<link href=
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel=
"stylesheet">


<style>

body{

background:
linear-gradient(
135deg,
#0f172a,
#1e293b
);

height:
100vh;

display:
flex;

justify-content:
center;

align-items:
center;

}


.card{

background:
rgba(
255,
255,
255,
0.05
);

padding:
40px;

border-radius:
20px;

width:
350px;

backdrop-filter:
blur(
15px
);

}


h2{

color:
white;

text-align:
center;

}


</style>


</head>


<body>


<div class=
"card">


<h2>

Login

</h2>



<form method=
"POST">


{% csrf_token %}



<input

name=
"username"

placeholder=
"Username"

class=
"form-control mb-3"

>



<input

type=
"password"

name=
"password"

placeholder=
"Password"

class=
"form-control mb-3"

>



<button

class=
"btn btn-primary w-100">

Login

</button>



</form>


</div>



</body>


</html>
