<!DOCTYPE html>
<html>

<head>

<title>Edit Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background:#0f172a;

font-family:Poppins;

color:white;

}

.container{

margin-top:50px;

max-width:700px;

}

.card{

background:#1e293b;

padding:30px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,0.3);

}

label{

margin-top:15px;

font-weight:600;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2 class="text-center mb-4">

✏️ Edit Profile

</h2>

<form method="POST">

{% csrf_token %}

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
value="{{ student.name }}">

<label>College</label>

<input
type="text"
name="college"
class="form-control"
value="{{ student.college }}">

<label>Skill</label>

<input
type="text"
name="skill"
class="form-control"
value="{{ student.skill }}">

<label>Learning</label>

<input
type="text"
name="need"
class="form-control"
value="{{ student.need }}">

<br>

<button class="btn btn-success">

Save Changes

</button>

<a
href="/profile/"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</body>

</html>
