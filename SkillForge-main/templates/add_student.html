<!DOCTYPE html>

<html>

<head>

<title>

Add Student

</title>


<link href=
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">


<style>

body{

background:
#0f172a;

color:
white;

padding:
50px;

}


.card{

background:
#1e293b;

padding:
30px;

border-radius:
20px;

max-width:
500px;

margin:auto;

}

</style>

</head>



<body>



<div class=
"card">


<h2>

Add Skill

</h2>



<form method=
"POST">


{% csrf_token %}



<input

name=
"name"

placeholder=
"Name"

class=
"form-control mb-3"

>



<input

name=
"skill"

placeholder=
"Skill"

class=
"form-control mb-3"

>



<input

name=
"need"

placeholder=
"Need"

class=
"form-control mb-3"

>



<input

name=
"college"

placeholder=
"College"

class=
"form-control mb-3"

>



<button

class=
"btn btn-primary">

Submit

</button>



</form>


</div>



</body>

</html>
